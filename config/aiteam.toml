# Live configuration.
#
# The provider is DeepSeek, reached through the OpenAI-compatible SDK adapter.
# The endpoint is stated explicitly because the engine refuses to guess one.
#
# [cost] is mandatory in live mode. max_context_tokens has no default: the
# operator must state the value for the chosen model.

[provider]
name = "deepseek"
timeout_seconds = 60
base_url = "https://api.deepseek.com"

[models]
orchestrator = "deepseek-flash"
developer = "deepseek-flash"
qa = "deepseek-flash"

[limits]
max_tasks_per_plan = 3
# Raised from 12 to 30 for M7: M5 evidence shows QA spent 12/12 turns
# writing one test file, while the Snake QA plan needs ten test files.
max_turns_per_session = 30
# Raised from 20 to 40 for the same M7 reason. Human-approved 2026-11-27.
max_llm_calls_per_task = 40
max_attempts = 2
command_timeout_seconds = 120
max_tool_output_chars = 8000

[cost]
# Raised from 1200 to 8000 for M7: a full game.py write exceeded 1200
# output tokens and the provider reply was truncated. Human-approved
# 2026-11-27.
max_output_tokens_per_call = 8000
safety_margin_percent = 10
estimator = "tiktoken"
# Operator-confirmed context window for the selected model. Raised from
# 32000 to 65536 for M7 after QA reached 24.5k input tokens plus an 8k
# output reservation. Human-approved 2026-11-27.
max_context_tokens = 65536

# Prices are operator-supplied conservative estimates in USD per million
# tokens, using the provider's published peak / cache-miss rates. Local token
# estimation is approximate, so the reservation is a ceiling, not a quote.
[pricing."deepseek-flash"]
input_per_mtok = 0.30
output_per_mtok = 1.20
